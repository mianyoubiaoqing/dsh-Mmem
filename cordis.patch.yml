- insert:
    - id: dsh-mmem-principal-local
      name: '@mistymoon/dsh-mmem/principal-local'
      config:
        ownerId: local-owner

    - id: dsh-mmem-memory
      name: '@mistymoon/dsh-mmem'
      config:
        spaceCatalogPath: !!js dshHomePath('dsh-mmem', 'catalog.json')
        spacesRoot: !!js dshHomePath('dsh-mmem', 'spaces')
        recallLimit: 8
        settingsPath: !!js dshHomePath('dsh-mmem', 'settings', 'settings.json')
        approvalPollIntervalMs: 60000
        approvalMaxCandidates: 100
        approvalMinimumConfidence: 0.9
        approvalReviewEnabled: true
        approvalReviewMaxTokens: 512
        leaseTimeoutMs: 30000
        leaseStaleMs: 120000
        disposeTimeoutMs: 5000
        maxArchiveBytes: 67108864
        maxTransactionBytes: 1048576
        channelDisclosure: personal-only

    - id: dsh-mmem-settings-host
      name: '@mistymoon/dsh-mmem/settings-host'

    - id: dsh-mmem-settings-ui
      name: '@mistymoon/dsh-mmem/settings-ui'
